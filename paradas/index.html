---
layout: default
title: Paradas
permalink: /paradas/
lang: es
ref: paradas
---

<header class="mb-4">
  <h1>Paradas de Taxi</h1>
  <p>Consulta las paradas del Área de Prestación Conjunta (Alicante, El Campello, San Vicente, San Juan y Muchamiel).</p>
</header>

<!-- Panel de Controles -->
<div class="panel-controles-mapa">
  <div class="grid">
    <div>
      <label for="filtro-municipio"><strong>Municipio</strong></label>
      <select id="filtro-municipio">
        <option value="todos">Todos los municipios</option>
        <option value="alicante">Alicante</option>
        <option value="el-campello">El Campello</option>
        <option value="san-vicente">San Vicente del Raspeig</option>
        <option value="san-juan">San Juan de Alicante</option>
        <option value="muchamiel">Muchamiel</option>
      </select>
    </div>

    <div>
      <label for="filtro-texto"><strong>Buscar parada</strong></label>
      <div class="buscador-con-sugerencias">
        <input 
          type="search" 
          id="filtro-texto" 
          placeholder="Ej: Pau 5, Gran Vía, Hospital..." 
          autocomplete="off"
        />
        <div id="sugerencias-container" class="sugerencias-lista"></div>
      </div>
      <div id="mensaje-sin-resultados" class="mensaje-sin-resultados" style="display: none;" role="status">
        ⚠️ No se encontraron paradas. Prueba con otros términos o selecciona un municipio.
      </div>
    </div>

    <div>
      <label for="filtro-pmr" class="switch-pmr">
        <input type="checkbox" id="filtro-pmr" role="switch">
        Solo adaptadas (PMR ♿)
      </label>
    </div>
  </div>

  <div class="contenedor-acciones-mapa">
    <button id="btn-mi-ubicacion" class="outline">
      📍 Usar mi ubicación
    </button>
    <button id="btn-parada-cercana" class="secondary" hidden>
      🎯 Ir a la parada más cercana
    </button>
  </div>
</div>

<!-- Contenedor del Mapa -->
<div id="mapa-paradas" class="mapa-paradas-container" aria-label="Mapa interactivo de paradas de taxi"></div>

<!-- Hojas de estilo -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="{{ '/assets/css/mapa-paradas.css' | relative_url }}">

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  window.PARADAS_DATA = {{ site.data.paradas | jsonify }};
  window.CURRENT_LANG = "{{ page.lang | default: 'es' }}";
</script>
<script src="{{ '/assets/js/mapa-paradas.js' | relative_url }}" defer></script>
