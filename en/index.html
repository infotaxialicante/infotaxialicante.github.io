---
layout: default
title: Taxi Ranks
lang: en
ref: paradas
---

<header class="mb-4">
  <h1>Taxi Ranks</h1>
  <p>Check the taxi ranks of the Joint Provision Area (Alicante, El Campello, San Vicente, San Juan, and Muchamiel).</p>
</header>

<!-- Controls Panel -->
<div class="panel-controles-mapa">
  <div class="grid">
    <div>
      <label for="filtro-municipio"><strong>Municipality</strong></label>
      <select id="filtro-municipio">
        <option value="todos">All municipalities</option>
        <option value="alicante">Alicante</option>
        <option value="el-campello">El Campello</option>
        <option value="san-vicente">San Vicente del Raspeig</option>
        <option value="san-juan">San Juan de Alicante</option>
        <option value="muchamiel">Muchamiel</option>
      </select>
    </div>

    <div>
      <label for="filtro-texto"><strong>Search rank</strong></label>
      <div class="buscador-con-sugerencias">
        <input 
          type="search" 
          id="filtro-texto" 
          placeholder="E.g.: Pau 5, Gran Vía, Hospital..." 
          autocomplete="off"
        />
        <div id="sugerencias-container" class="sugerencias-lista"></div>
      </div>
      <div id="mensaje-sin-resultados" class="mensaje-sin-resultados" style="display: none;" role="status">
        ⚠️ No ranks found. Try different terms or select a municipality.
      </div>
    </div>

    <div>
      <label for="filtro-pmr" class="switch-pmr">
        <input type="checkbox" id="filtro-pmr" role="switch">
        Accessible only (PRM ♿)
      </label>
    </div>
  </div>

  <div class="contenedor-acciones-mapa">
    <button id="btn-mi-ubicacion" class="outline">
      📍 Use my location
    </button>
    <button id="btn-parada-cercana" class="secondary" hidden>
      🎯 Go to nearest rank
    </button>
  </div>
</div>

<!-- Map Container -->
<div id="mapa-paradas" class="mapa-paradas-container" aria-label="Interactive map of taxi ranks"></div>

<!-- Stylesheets -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="{{ '/assets/css/mapa-paradas.css' | relative_url }}">

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  window.PARADAS_DATA = {{ site.data.paradas | jsonify }};
  window.CURRENT_LANG = "{{ page.lang | default: 'en' }}";
</script>
<script src="{{ '/assets/js/mapa-paradas.js' | relative_url }}" defer></script>
