<header class="site-header">
  <nav class="container nav-container">
    <div class="nav-header">
      <a href="{% if include.lang == 'en' %}/en/{% else %}/{% endif %}" class="logo">
        <strong>infotaxialicante.es</strong>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navMenu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>

    <ul class="nav-menu" id="navMenu">
      {% if include.lang == 'en' %}
        <li><a href="/en/calculator/" {% if page.ref == 'calculator' %}class="active"{% endif %}>Calculator</a></li>
        <li><a href="/en/ranks/" {% if page.ref == 'ranks' %}class="active"{% endif %}>Ranks</a></li>
        <li><a href="/en/blog/" {% if page.ref == 'blog' %}class="active"{% endif %}>Blog</a></li>
        <li><a href="/en/downloads/" {% if page.ref == 'downloads' %}class="active"{% endif %}>Downloads</a></li>
      {% else %}
        <li><a href="/calculadora/" {% if page.ref == 'calculator' %}class="active"{% endif %}>Calculadora</a></li>
        <li><a href="/paradas/" {% if page.ref == 'ranks' or page.url contains '/paradas/' %}class="active"{% endif %}>Paradas</a></li>
        <li><a href="/blog/" {% if page.ref == 'blog' or page.url contains '/blog/' %}class="active"{% endif %}>Blog</a></li>
        <li><a href="/descargas/" {% if page.ref == 'downloads' or page.url contains '/descargas/' %}class="active"{% endif %}>Descargas</a></li>
      {% endif %}
    </ul>
  </nav>
</header>
